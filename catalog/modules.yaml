# catalog/modules.yaml
#
# Machine-readable inventory for platform-iac-modules.
#
# Automation consumers:
#   - tests/smoke/run-smoke-tests.py reads `modules[].name` and `modules[].path`.
#   - documentation and release tooling use the module metadata below.
#
# Contract:
#   - `name` must equal the directory basename under `modules/`.
#   - `path` is repository-relative and uses forward slashes.
#   - `inputs.required` contains only variables without a Terraform default.
#   - `outputs` mirrors the public output names in the module's outputs.tf.
#   - Provider and Terraform constraints are copied from the module's
#     versions.tf; the module README remains authoritative for behavior.

schema_version: 1

catalog:
  name: platform-iac-modules
  description: >-
    Reusable Terraform modules for AWS platform foundations, including remote
    state, audit logging, threat detection, encryption, CI identity, and
    Organizations governance.
  repository: github.com/Mahdiar-Farzinfar/platform-iac-modules
  module_path: modules
  release_tag_pattern: module/<module-name>/v<semver>

# Canonical version sources are tooling/.tool-versions, tooling/.terraform-version,
# and go.mod. This summary is intentionally kept current for catalog consumers;
# verify mirrors with scripts/tools/verify-toolchain.py.
toolchain:
  terraform: "1.15.6"
  go: "1.26.0"
  python: "3.12.4"
  task: "3.39.2"
  terraform-docs: "0.18.0"
  tflint: "0.56.0"
  checkov: "3.3.8"
  trivy: "0.72.0"
  gitleaks: "8.30.1"
  golangci-lint: "2.13.1"
  pre-commit: "4.0.1"
  markdownlint: "0.17.2"
  yamllint: "1.37.1"
  actionlint: "1.7.7"
  shfmt: "3.13.1"
  just: "1.36.0"
  nodejs: "24.18.0"
  docker-cli: "29.6.1"
  docker-compose: "5.3.0"

# Defaults applied to every module unless overridden.
defaults:
  provider_platform: aws
  lifecycle: active
  maturity: stable
  documentation:
    readme: README.md
    example: examples/basic
  lint:
    tflint_config: tooling/.tflint.hcl
    checkov_config: tooling/.checkov.yml
  test:
    native: true
    terratest: false
    integration_requires_aws: false

modules:
  - name: backend-bootstrap
    path: modules/backend-bootstrap
    description: >-
      Creates hardened S3 state storage and a DynamoDB lock table, with
      encryption, access logging, lifecycle controls, and deletion safeguards.
    category: foundation
    terraform:
      required_version: ">= 1.6.0, < 2.0.0"
    providers:
      - source: hashicorp/aws
        version: ">= 5.70.0, < 7.0.0"
    inputs:
      required: [name_prefix, kms_key_arn]
    outputs:
      - state_bucket_name
      - state_bucket_arn
      - state_bucket_region
      - lock_table_name
      - lock_table_arn
      - access_logs_bucket_name
      - access_logs_bucket_arn
      - kms_key_arn
      - backend_config
      - backend_hcl_snippet
    test:
      native_files: [tests/backend-bootstrap.tftest.hcl]

  - name: cloudtrail
    path: modules/cloudtrail
    description: >-
      Configures an account-level, multi-Region CloudTrail with an S3
      destination, optional KMS encryption, CloudWatch Logs delivery, lifecycle
      controls, and event selectors.
    category: audit
    terraform:
      required_version: ">= 1.3.0"
    providers:
      - source: hashicorp/aws
        version: "~> 5.0"
    inputs:
      required: [trail_name, name]
    outputs:
      - trail_id
      - trail_arn
      - trail_name
      - trail_home_region
      - trail_is_multi_region
      - trail_logging_enabled
      - kms_key_arn
      - kms_key_id
      - kms_key_alias_arn
      - kms_key_alias_name
      - kms_key_created
      - s3_bucket_id
      - s3_bucket_arn
      - s3_bucket_domain_name
      - s3_bucket_regional_domain_name
      - s3_key_prefix
      - s3_log_path_prefix
      - s3_bucket_created
      - cloudwatch_log_group_name
      - cloudwatch_log_group_arn
      - cloudwatch_logs_role_arn
      - cloudwatch_logs_role_name
      - tags
    test:
      native_files: [tests/cloudtrail.tftest.hcl]
      terratest: true
      terratest_files: [tests/integration_test.go]
      integration_requires_aws: true

  - name: github-oidc
    path: modules/github-oidc
    description: >-
      Establishes GitHub Actions OpenID Connect federation and configurable,
      repository-scoped IAM roles for CI workloads.
    category: identity
    terraform:
      required_version: ">= 1.6.0"
    providers:
      - source: hashicorp/aws
        version: ">= 5.81.0"
    inputs:
      required: []
    outputs:
      - oidc_provider_arn
      - oidc_provider_url
      - role_arns
      - role_names
    test:
      native_files: [tests/github-oidc.tftest.hcl]

  - name: guardduty
    path: modules/guardduty
    description: >-
      Enables GuardDuty detector features, optional finding destinations,
      trusted and threat-intelligence sets, filters, and Organizations
      configuration.
    category: security
    terraform:
      required_version: ">= 1.5.0, < 2.0.0"
    providers:
      - source: hashicorp/aws
        version: ">= 5.40.0, < 7.0.0"
    inputs:
      required: []
    outputs:
      - enabled
      - detector_id
      - detector_arn
      - account_id
      - detector_feature_ids
      - publishing_destination_id
      - ipset_ids
      - threat_intel_set_ids
      - filter_ids
      - organization_admin_account_id
      - organization_configuration_id
      - organization_feature_ids
      - tags
    test:
      native_files: [tests/guardduty.tftest.hcl]
      terratest: true
      terratest_files: [tests/integration_test.go]
      integration_requires_aws: true

  - name: kms
    path: modules/kms
    description: >-
      Creates customer-managed KMS primary or replica keys with policy
      composition, aliases, grants, rotation, and deletion safeguards.
    category: security
    terraform:
      required_version: ">= 1.3.0"
    providers:
      - source: hashicorp/aws
        version: ">= 5.0"
    inputs:
      required: []
    outputs:
      - key_arn
      - key_id
      - key_policy
      - aliases
      - grants
      - grant_tokens
    test:
      native_files: [tests/kms.tftest.hcl]
      terratest: true
      terratest_files: [tests/integration_test.go]
      integration_requires_aws: true

  - name: log-archive-bucket
    path: modules/log-archive-bucket
    description: >-
      Provides a private, versioned S3 log archive with encryption, lifecycle
      transitions, optional Object Lock, access logging, and delivery policies.
    category: audit
    terraform:
      required_version: ">= 1.5.0, < 2.0.0"
    providers:
      - source: hashicorp/aws
        version: ">= 5.0.0, < 7.0.0"
    inputs:
      required: [bucket_name]
    outputs:
      - bucket_id
      - bucket_arn
      - bucket_domain_name
      - bucket_region
      - versioning_status
      - encryption_algorithm
      - kms_key_arn
      - object_lock_enabled
      - tags
    test:
      native_files: [tests/log-archive-bucket.tftest.hcl]

  - name: scp
    path: modules/scp
    description: >-
      Creates and attaches AWS Organizations Service Control Policies from raw
      JSON or structured statements, with lifecycle and retention safeguards.
    category: governance
    terraform:
      required_version: ">= 1.5"
    providers:
      - source: hashicorp/aws
        version: ">= 5.0, < 6.0"
    inputs:
      required: [name]
    outputs:
      - id
      - arn
      - name
      - aws_managed
      - policy_content
      - target_ids
      - attachments
    test:
      native_files: [tests/scp.tftest.hcl]
      terratest: true
      terratest_files: [tests/integration_test.go]
      integration_requires_aws: true
