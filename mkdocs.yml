# mkdocs.yml — Platform IaC Modules documentation
# Built by .github/workflows/docs.yml (recommended: `mkdocs build --strict`)

site_name: Platform IaC Modules
site_description: >-
  Reusable, security-hardened Terraform modules for AWS platform
  foundations: state backend, OIDC, KMS, logging, CloudTrail,
  GuardDuty, and SCPs.
site_url: https://Mahdiar-Farzinfar.github.io/platform-iac-modules/
site_author: Mahdiar-Farzinfar

repo_name: Mahdiar-Farzinfar/platform-iac-modules
repo_url: https://github.com/Mahdiar-Farzinfar/platform-iac-modules
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2026 Mahdiar-Farzinfar — licensed under the terms in
  <a href="https://github.com/Mahdiar-Farzinfar/platform-iac-modules/blob/main/LICENSE">LICENSE</a>.

# Only docs/ is published; module READMEs stay on GitHub next to the code.
docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/cube-outline
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link

nav:
  - Home: index.md
  - Guides:
      - Module Development: module-development.md
      - Security Baseline: security-baseline.md
      - Versioning & Releases: versioning.md
      - Cross-Platform Tooling: cross-platform.md

# docs/README.md is a directory-level readme for GitHub, not a site page.
not_in_nav: |
  README.md

exclude_docs: |
  drafts/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  # Core
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  # PyMdown Extensions
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Mahdiar-Farzinfar
      repo: platform-iac-modules
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mahdiar-Farzinfar/platform-iac-modules
  # Version selector via mike (pairs well with the versioning.md strategy)
  version:
    provider: mike
    default: latest

watch:
  - docs
