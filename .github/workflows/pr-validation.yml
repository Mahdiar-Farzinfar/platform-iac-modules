---
name: pr-validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  CI: "true"
  TF_IN_AUTOMATION: "true"
  TASK_X_REMOTE_TASKFILES: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  validate:
    name: PR Validate
    runs-on: ubuntu-24.04
    outputs:
      sarif_exists: ${{ steps.sarif_check.outputs.exists }}
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: read

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a  # v7.0.0
        with:
          fetch-depth: 200
          persist-credentials: false

      - name: Read canonical tool versions
        id: tool_versions
        run: |
          TERRAFORM_VERSION="$(tr -d '\r' < tooling/.terraform-version | xargs)"
          PYTHON_VERSION="$(awk '$1 == "python" { print $2 }' tooling/.tool-versions | head -n 1)"
          TASK_VERSION="$(awk '$1 == "task" { print $2 }' tooling/.tool-versions | head -n 1)"
          NODE_VERSION="$(awk '$1 == "nodejs" { print $2 }' tooling/.tool-versions | head -n 1)"
          GITLEAKS_VERSION="$(awk '$1 == "gitleaks" { print $2 }' tooling/.tool-versions | head -n 1)"
          GOLANGCI_LINT_VERSION="$(awk '$1 == "golangci-lint" { print $2 }' tooling/.tool-versions | head -n 1)"

          [[ -n "${TERRAFORM_VERSION}" ]] || { echo "Terraform version is missing"; exit 1; }
          [[ -n "${PYTHON_VERSION}" ]] || { echo "Python version is missing"; exit 1; }
          [[ -n "${TASK_VERSION}" ]] || { echo "Task version is missing"; exit 1; }
          [[ -n "${NODE_VERSION}" ]] || { echo "Node.js version is missing"; exit 1; }
          [[ -n "${GITLEAKS_VERSION}" ]] || { echo "Gitleaks version is missing"; exit 1; }
          [[ -n "${GOLANGCI_LINT_VERSION}" ]] || { echo "golangci-lint version is missing"; exit 1; }

          {
            echo "terraform=${TERRAFORM_VERSION}"
            echo "python=${PYTHON_VERSION}"
            echo "task=${TASK_VERSION}"
            echo "node=${NODE_VERSION}"
            echo "gitleaks=${GITLEAKS_VERSION}"
            echo "golangci-lint=${GOLANGCI_LINT_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ steps.tool_versions.outputs.python }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: ${{ steps.tool_versions.outputs.terraform }}

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: ${{ steps.tool_versions.outputs.task }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ steps.tool_versions.outputs.node }}

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: ${{ steps.tool_versions.outputs.gitleaks }}
        run: |
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) GL_ARCH="x64" ;;
            aarch64|arm64) GL_ARCH="arm64" ;;
            *) echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"

          tar -xzf "${TARBALL}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${TARBALL}" gitleaks

          gitleaks version

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: ${{ steps.tool_versions.outputs.golangci-lint }}
        run: |
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) GL_ARCH="amd64" ;;
            aarch64|arm64) GL_ARCH="arm64" ;;
            *) echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac

          VERSION="${GOLANGCI_LINT_VERSION#v}"

          TARBALL="golangci-lint-${VERSION}-linux-${GL_ARCH}.tar.gz"
          BASE_URL="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"

          curl -fsSL -o "${TARBALL}" "${BASE_URL}/${TARBALL}"
          tar -xzf "${TARBALL}" "golangci-lint-${VERSION}-linux-${GL_ARCH}/golangci-lint"
          sudo install -m 0755 \
            "golangci-lint-${VERSION}-linux-${GL_ARCH}/golangci-lint" \
            /usr/local/bin/golangci-lint

          rm -rf "${TARBALL}" "golangci-lint-${VERSION}-linux-${GL_ARCH}"

          command -v golangci-lint >/dev/null
          golangci-lint version

      - name: Install CI utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip curl
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1
          npm install --global markdownlint-cli@0.41.0

      - name: Fetch base branch
        run: git fetch --no-tags --prune --depth=200 origin "${{ github.base_ref }}"

      - name: Verify outputs
        run: task verify:outputs

      - name: Run CI gate
        run: task ci

      - name: Check SARIF presence
        id: sarif_check
        if: always()
        run: |
          if [[ -f results.sarif ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload SARIF artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        with:
          name: pr-validation-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 1

  upload-sarif:
    name: Upload SARIF
    runs-on: ubuntu-24.04
    needs: validate
    if: always() && needs.validate.outputs.sarif_exists == 'true'

    permissions:
      security-events: write

    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pr-validation-sarif
          path: .

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          sarif_file: results.sarif

  all-pr-validation-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs: [validate, upload-sarif]
    if: always()

    permissions: {}

    steps:
      - name: Evaluate job results
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "validate job did not succeed: ${{ needs.validate.result }}"
            exit 1
          fi

          if [[ "${{ needs.upload-sarif.result }}" != "success" && "${{ needs.upload-sarif.result }}" != "skipped" ]]; then
            echo "upload-sarif job did not succeed: ${{ needs.upload-sarif.result }}"
            exit 1
          fi

          echo "All required jobs passed."
