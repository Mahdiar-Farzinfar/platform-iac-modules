---
name: "Documentation Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "**.tf"
      - ".terraform-docs.yml"
      - "tooling/.tool-versions"
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
  pull_request:
    paths:
      - "modules/**"
      - "**.tf"
      - ".terraform-docs.yml"
      - "tooling/.tool-versions"
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"

permissions: {}

concurrency:
  group: documentation-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOL_VERSIONS_FILE: tooling/.tool-versions
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  validate-docs:
    name: "Generate and Validate Docs"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      docs_drifted: ${{ steps.drift.outputs.drifted }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Resolve tool versions"
        id: versions
        run: |
          set -euo pipefail

          if [[ ! -f "${TOOL_VERSIONS_FILE}" ]]; then
            echo "::error::Tool versions file not found: ${TOOL_VERSIONS_FILE}"
            exit 1
          fi

          terraform_docs_version="$(awk '$1 == "terraform-docs" { print $2; exit }' "${TOOL_VERSIONS_FILE}")"

          if [[ -z "${terraform_docs_version}" ]]; then
            echo "::error::terraform-docs version is not defined in ${TOOL_VERSIONS_FILE}"
            exit 1
          fi

          terraform_docs_version="${terraform_docs_version#v}"

          {
            echo "terraform_docs_version=${terraform_docs_version}"
            echo "terraform_docs_tag=v${terraform_docs_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: "Install terraform-docs"
        run: |
          set -euo pipefail

          tag="${{ steps.versions.outputs.terraform_docs_tag }}"
          archive="terraform-docs-${tag}-linux-amd64.tar.gz"
          checksum_file="terraform-docs-${tag}.sha256sum"
          base_url="https://github.com/terraform-docs/terraform-docs/releases/download/${tag}"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output "${archive}" \
            "${base_url}/${archive}"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output "${checksum_file}" \
            "${base_url}/${checksum_file}"

          grep " ${archive}\$" "${checksum_file}" | sha256sum --check -

          install_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${install_dir}"

          tar -xzf "${archive}" terraform-docs
          install -m 0755 terraform-docs "${install_dir}/terraform-docs"

          echo "${install_dir}" >> "${GITHUB_PATH}"
          export PATH="${install_dir}:${PATH}"

          command -v terraform-docs >/dev/null
          terraform-docs --version
          rm -f "${archive}" "${checksum_file}" terraform-docs

      - name: "Generate documentation"
        run: |
          set -euo pipefail
          # Generate documentation only for module roots directly under modules/.
          # Use repo-root configuration with recursive generation disabled.
          if [[ -d modules ]]; then
            while IFS= read -r -d '' module_dir; do
              if [[ -z "$(find "${module_dir}" -maxdepth 1 -type f -name '*.tf' -print -quit)" ]]; then
                continue
              fi
            echo "Generating docs for: ${module_dir}"
              command -v terraform-docs >/dev/null
              terraform-docs markdown table --config ".terraform-docs.yml" --recursive=false --output-file README.md --output-mode inject "${module_dir}"
            done < <(find modules -mindepth 1 -maxdepth 1 -type d -print0)
          fi

      - name: "Detect documentation drift"
        id: drift
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md modules; then
            echo "drifted=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Documentation drift detected"
            git --no-pager diff -- README.md modules || true
            echo "drifted=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: "Fail PR when docs drift exists"
        if: github.event_name == 'pull_request' && steps.drift.outputs.drifted == 'true'
        run: |
          echo "::error::Generated documentation is out of date. Run terraform-docs locally (same config/version as tooling/.tool-versions) and commit the result."
          exit 1

  create-docs-pr:
    name: "Create Documentation PR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-docs
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-docs.outputs.docs_drifted == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Resolve tool versions"
        id: versions
        run: |
          set -euo pipefail

          if [[ ! -f "${TOOL_VERSIONS_FILE}" ]]; then
            echo "::error::Tool versions file not found: ${TOOL_VERSIONS_FILE}"
            exit 1
          fi

          terraform_docs_version="$(awk '$1 == "terraform-docs" { print $2; exit }' "${TOOL_VERSIONS_FILE}")"

          if [[ -z "${terraform_docs_version}" ]]; then
            echo "::error::terraform-docs version is not defined in ${TOOL_VERSIONS_FILE}"
            exit 1
          fi

          terraform_docs_version="${terraform_docs_version#v}"

          {
            echo "terraform_docs_version=${terraform_docs_version}"
            echo "terraform_docs_tag=v${terraform_docs_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: "Install terraform-docs"
        run: |
          set -euo pipefail

          tag="${{ steps.versions.outputs.terraform_docs_tag }}"
          archive="terraform-docs-${tag}-linux-amd64.tar.gz"
          checksum_file="terraform-docs-${tag}.sha256sum"
          base_url="https://github.com/terraform-docs/terraform-docs/releases/download/${tag}"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output "${archive}" \
            "${base_url}/${archive}"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output "${checksum_file}" \
            "${base_url}/${checksum_file}"

          grep " ${archive}\$" "${checksum_file}" | sha256sum --check -

          install_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${install_dir}"

          tar -xzf "${archive}" terraform-docs
          install -m 0755 terraform-docs "${install_dir}/terraform-docs"

          echo "${install_dir}" >> "${GITHUB_PATH}"
          export PATH="${install_dir}:${PATH}"

          command -v terraform-docs >/dev/null
          terraform-docs --version
          rm -f "${archive}" "${checksum_file}" terraform-docs

      - name: "Generate documentation"
        run: |
          set -euo pipefail

          # Generate documentation only for module roots directly under modules/.
          # Use repo-root configuration with recursive generation disabled.
          if [[ -d modules ]]; then
            while IFS= read -r -d '' module_dir; do
              if [[ -z "$(find "${module_dir}" -maxdepth 1 -type f -name '*.tf' -print -quit)" ]]; then
                continue
              fi
            echo "Generating docs for: ${module_dir}"
              command -v terraform-docs >/dev/null
              terraform-docs markdown table --config ".terraform-docs.yml" --recursive=false --output-file README.md --output-mode inject "${module_dir}"
            done < <(find modules -mindepth 1 -maxdepth 1 -type d -print0)
          fi

      - name: "Create pull request for generated docs"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(terraform): auto-generate documentation"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "automation/terraform-docs"
          delete-branch: true
          title: "docs(terraform): auto-generate documentation"
          body: |
            This PR updates generated Terraform documentation to keep it in sync with the latest Terraform code changes.

            - Generated automatically by the documentation pipeline
            - Source of truth: Terraform modules and `.terraform-docs.yml`
            - Tool version SoT: `tooling/.tool-versions` (`terraform-docs`)
          labels: |
            documentation
            automation
          add-paths: |
            README.md
            modules/**

  build-site:
    name: "Build MkDocs Site"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # required by git-revision-date plugins if enabled

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: "Install MkDocs toolchain"
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f docs/requirements.txt ]]; then
            pip install --require-hashes -r docs/requirements.txt
          else
            echo "::error::docs/requirements.txt not found. Pin MkDocs dependencies for reproducible builds."
            exit 1
          fi

          mkdocs --version

      - name: "Build documentation site"
        run: |
          set -euo pipefail
          # --strict fails the build on broken links / warnings.
          mkdocs build --strict --site-dir ./site

      - name: "Configure GitHub Pages"
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: ./site

  deploy-site:
    name: "Deploy MkDocs Site"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build-site
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      pages: write       # deploy to GitHub Pages
      id-token: write    # OIDC verification for the deployment
    # Pages deployments must not be cancelled mid-flight; use a dedicated,
    # non-cancelling concurrency group that overrides the workflow-level one.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  all-checks-passed:
    name: "All Checks Passed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validate-docs
      - create-docs-pr
      - build-site
      - deploy-site
    if: always()
    permissions: {}

    steps:
      - name: "Evaluate job results"
        run: |
          set -euo pipefail

          validate_result="${{ needs.validate-docs.result }}"
          create_pr_result="${{ needs.create-docs-pr.result }}"
          build_site_result="${{ needs.build-site.result }}"
          deploy_site_result="${{ needs.deploy-site.result }}"

          echo "validate-docs: ${validate_result}"
          echo "create-docs-pr: ${create_pr_result}"
          echo "build-site: ${build_site_result}"
          echo "deploy-site: ${deploy_site_result}"

          failed=false

          if [[ "${validate_result}" != "success" ]]; then
            echo "::error::validate-docs did not succeed (result: ${validate_result})"
            failed=true
          fi

          if [[ "${create_pr_result}" != "success" && "${create_pr_result}" != "skipped" ]]; then
            echo "::error::create-docs-pr did not succeed (result: ${create_pr_result})"
            failed=true
          fi

          if [[ "${build_site_result}" != "success" ]]; then
            echo "::error::build-site did not succeed (result: ${build_site_result})"
            failed=true
          fi

          # deploy-site only runs on push to main; "skipped" is acceptable on PRs.
          if [[ "${deploy_site_result}" != "success" && "${deploy_site_result}" != "skipped" ]]; then
            echo "::error::deploy-site did not succeed (result: ${deploy_site_result})"
            failed=true
          fi

          if [[ "${failed}" == "true" ]]; then
            exit 1
          fi

          echo "All required jobs passed."
