---
name: Cross-platform Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/cross-platform-test.yml"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - ".tool-versions"
      - "justfile"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "scripts/**"
      - "tests/cross-platform/**"
      - "tests/smoke/**"
      - "tooling/**"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-platform-test.yml"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - ".tool-versions"
      - "justfile"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "scripts/**"
      - "tests/cross-platform/**"
      - "tests/smoke/**"
      - "tooling/**"
      - "modules/**"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: cross-platform-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO111MODULE: "on"

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            linux:
              - '.github/workflows/cross-platform-test.yml'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - '.tool-versions'
              - 'justfile'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'scripts/**'
              - 'tests/cross-platform/**'
              - 'tests/smoke/**'
              - 'tooling/**'
              - 'modules/**'

            macos:
              - '.github/workflows/cross-platform-test.yml'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - '.tool-versions'
              - 'justfile'
              - 'Makefile'
              - 'scripts/bootstrap/**'
              - 'scripts/tools/**'
              - 'tests/cross-platform/**'
              - 'tests/smoke/**'
              - 'tooling/cross-platform/**'

            windows:
              - '.github/workflows/cross-platform-test.yml'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - '.tool-versions'
              - 'justfile'
              - 'Makefile'
              - 'scripts/bootstrap/**'
              - 'scripts/windows/**'
              - 'scripts/tools/**'
              - 'tests/cross-platform/**'
              - 'tests/smoke/**'
              - 'tooling/cross-platform/**'

  resolve-tool-versions:
    name: Resolve tool versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      python: ${{ steps.python.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Python version from .tool-versions
        id: python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path '.tool-versions')) {
            throw 'ERROR: .tool-versions not found'
          }

          $line = Select-String -Path '.tool-versions' -Pattern '^\s*python\s+(\S+)\s*$' | Select-Object -First 1
          if (-not $line) {
            throw 'ERROR: python version not found in .tool-versions'
          }

          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

  linux:
    name: Cross-platform • linux-x86_64
    needs: [detect-changes, resolve-tool-versions]
    if: needs.detect-changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde  # v2.9.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
          check-latest: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ needs.resolve-tool-versions.outputs.python }}
          check-latest: false

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cross-platform-go-Linux-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            cross-platform-go-Linux-

      - name: Detect OS/arch (Task SoT)
        shell: bash
        run: task os:detect

      - name: Preflight (Task SoT)
        shell: bash
        env:
          TF_IN_AUTOMATION: "true"
        run: task preflight

      - name: Verify install-tools-posix.go (compile + smoke)
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="scripts/tools/install-tools-posix.go"
          test -f "${SCRIPT}"

          # Compile-only (no install side effects)
          go build -o /tmp/install-tools-posix "${SCRIPT}"

          if /tmp/install-tools-posix --help >/dev/null 2>&1; then
            /tmp/install-tools-posix --help | head -n 40
          elif /tmp/install-tools-posix -h >/dev/null 2>&1; then
            /tmp/install-tools-posix -h | head -n 40
          else
            echo "NOTE: no --help/-h; compile succeeded (acceptable for installer CLI)"
          fi

          rm -f /tmp/install-tools-posix

      - name: Run cross-platform tests (Task SoT)
        shell: bash
        run: task test:cross-platform:linux

      - name: Upload cross-platform artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cross-platform-linux-x86_64-artifacts
          path: tests/cross-platform/output/**
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: Cross-platform • macos-arm64
    needs: [detect-changes, resolve-tool-versions]
    if: needs.detect-changes.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde  # v2.9.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
          check-latest: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ needs.resolve-tool-versions.outputs.python }}
          check-latest: false

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: cross-platform-go-macOS-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            cross-platform-go-macOS-

      - name: Detect OS/arch (Task SoT)
        shell: bash
        run: task os:detect

      - name: Preflight (Task SoT)
        shell: bash
        run: task preflight

      - name: Verify install-tools-posix.go (compile + smoke)
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="scripts/tools/install-tools-posix.go"
          test -f "${SCRIPT}"

          OUT="$(mktemp -t install-tools-posix)"
          go build -o "${OUT}" "${SCRIPT}"

          if "${OUT}" --help >/dev/null 2>&1; then
            "${OUT}" --help | head -n 40
          elif "${OUT}" -h >/dev/null 2>&1; then
            "${OUT}" -h | head -n 40
          else
            echo "NOTE: no --help/-h; compile succeeded"
          fi

          rm -f "${OUT}"

      - name: Run cross-platform tests (Task SoT)
        shell: bash
        run: task test:cross-platform:macos

      - name: Upload cross-platform artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cross-platform-macos-arm64-artifacts
          path: tests/cross-platform/output/**
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Cross-platform • windows-x86_64
    needs: [detect-changes, resolve-tool-versions]
    if: needs.detect-changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde  # v2.9.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
          check-latest: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ needs.resolve-tool-versions.outputs.python }}
          check-latest: false

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            C:\Users\runneradmin\go\pkg\mod
            C:\Users\runneradmin\AppData\Local\go-build
          key: cross-platform-go-Windows-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            cross-platform-go-Windows-

      - name: Detect OS/arch (Task SoT)
        shell: bash
        run: task os:detect

      - name: Preflight (Task SoT)
        shell: bash
        run: task preflight

      - name: Verify scripts/windows/tasks.ps1 (syntax)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/windows/tasks.ps1'
          if (-not (Test-Path -LiteralPath $path)) {
            throw "ERROR: missing $path"
          }

          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $path).Path,
            [ref]$tokens,
            [ref]$errors
          )

          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw "ERROR: PowerShell parse failed for $path"
          }

          Write-Host "OK: PowerShell syntax valid for $path"

      - name: Verify install-tools-windows.go (compile + smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/tools/install-tools-windows.go'
          if (-not (Test-Path -LiteralPath $script)) {
            throw "ERROR: missing $script"
          }

          $out = Join-Path $env:RUNNER_TEMP 'install-tools-windows.exe'
          & go build -o $out $script
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }

          $helpOk = $false
          try {
            & $out --help 2>$null | Out-Host
            if ($LASTEXITCODE -eq 0) { $helpOk = $true }
          } catch { }

          if (-not $helpOk) {
            try {
              & $out -h 2>$null | Out-Host
              if ($LASTEXITCODE -eq 0) { $helpOk = $true }
            } catch { }
          }

          if (-not $helpOk) {
            Write-Host 'NOTE: no --help/-h; compile succeeded'
          }

          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue

      - name: Run cross-platform tests (Task SoT)
        shell: bash
        run: task test:cross-platform:windows

      - name: Upload cross-platform artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cross-platform-windows-x86_64-artifacts
          path: tests/cross-platform/output/**
          if-no-files-found: ignore
          retention-days: 7

  all-cross-platform-tests-passed:
    name: All cross-platform tests passed
    if: always()
    needs:
      - detect-changes
      - resolve-tool-versions
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Evaluate overall status
        run: |
          set -euo pipefail

          statuses=(
            "${{ needs.detect-changes.result }}"
            "${{ needs.resolve-tool-versions.result }}"
            "${{ needs.linux.result }}"
            "${{ needs.macos.result }}"
            "${{ needs.windows.result }}"
          )

          failed=0
          for status in "${statuses[@]}"; do
            case "$status" in
              success|skipped)
                ;;
              *)
                echo "ERROR: dependent job reported status '$status'"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more required jobs failed."
            exit 1
          fi

          echo "All required jobs passed (or were correctly skipped)."
